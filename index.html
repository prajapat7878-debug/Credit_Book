<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1e3a8a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Digital Khata</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: '#1e40af', // Native blue
                        brand_dark: '#1e3a8a',
                        diya: '#ef4444',  // Red (Udhaar)
                        mila: '#10b981',  // Emerald Green (Jama)
                        surface: '#f3f4f6'
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Mobile Native App Optimizations */
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        input, textarea {
            user-select: auto;
        }
        body {
            overscroll-behavior-y: none;
            background-color: #000;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .screen-transition { transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.3s; }
        .modal-overlay { backdrop-filter: blur(4px); }
        .avatar-img { object-fit: cover; }
        
        .active-scale:active { transform: scale(0.96); opacity: 0.9; transition: 0.1s; }

        /* Print Settings for Shandar Table Output */
        @media print {
            body { background-color: white !important; }
            #app, #toast, .modal-overlay { display: none !important; }
            #print-area { display: block !important; width: 100%; padding: 15px; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            @page { margin: 10mm; }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen text-gray-800">

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-12 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-xl shadow-2xl transition-all duration-300 opacity-0 pointer-events-none z-[9999] font-semibold text-sm text-center min-w-[220px] tracking-wide">
        Message
    </div>

    <!-- Main App Container -->
    <div id="app" class="w-full max-w-md mx-auto h-[100dvh] bg-gray-50 flex flex-col relative overflow-hidden shadow-2xl bg-surface">

        <!-- ================= HOME SCREEN ================= -->
        <div id="home-screen" class="absolute inset-0 flex flex-col w-full h-full z-10 screen-transition bg-gray-50">
            
            <!-- Header (Premium Gradient) -->
            <header class="bg-gradient-to-r from-brand_dark to-brand text-white pt-6 pb-5 px-5 shadow-lg rounded-b-[1.5rem] z-20 relative">
                <div class="flex justify-between items-center mb-5">
                    <div class="flex items-center gap-3">
                        <button onclick="openModal('profile-modal')" class="w-11 h-11 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 transition overflow-hidden border-2 border-white/30 active-scale" id="header-avatar-btn">
                            <i class="fa-solid fa-user text-xl"></i>
                        </button>
                        <div>
                            <h1 class="text-xl font-extrabold tracking-tight leading-tight" id="header-biz-name" data-i18n="appTitle">Digital Khata</h1>
                            <p class="text-[11px] text-blue-200 font-medium tracking-wide uppercase mt-0.5" data-i18n="myProfile">My Profile &gt;</p>
                        </div>
                    </div>
                    <button onclick="openModal('settings-modal')" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center active-scale transition text-lg">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                </div>

                <!-- Dashboard Summary Cards -->
                <div class="flex bg-white rounded-2xl p-4 shadow-xl w-full gap-3 text-gray-800 absolute -bottom-10 left-0 right-0 mx-auto w-[90%]">
                    <div class="flex-1 text-center border-r border-gray-100">
                        <div class="flex items-center justify-center gap-1 mb-1">
                            <i class="fa-solid fa-arrow-up text-[10px] text-diya"></i>
                            <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider" data-i18n="youWillGet">Milega</p>
                        </div>
                        <p class="text-xl font-extrabold text-diya" id="total-udhaar">₹0</p>
                    </div>
                    <div class="flex-1 text-center">
                        <div class="flex items-center justify-center gap-1 mb-1">
                            <i class="fa-solid fa-arrow-down text-[10px] text-mila"></i>
                            <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider" data-i18n="youWillGive">Dena Hai</p>
                        </div>
                        <p class="text-xl font-extrabold text-mila" id="total-advance">₹0</p>
                    </div>
                </div>
            </header>

            <!-- Search Bar -->
            <div class="mt-14 px-5 pb-2 z-10">
                <div class="relative shadow-sm rounded-full">
                    <i class="fa-solid fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 text-sm"></i>
                    <input type="text" id="search-input" data-i18n-placeholder="searchPlaceholder" placeholder="Grahak khojein..." 
                        class="w-full bg-white border-none rounded-full py-3.5 pl-11 pr-4 focus:outline-none focus:ring-2 focus:ring-brand/30 text-sm font-medium text-gray-700 shadow-sm transition-all"
                        oninput="filterCustomers()">
                </div>
            </div>

            <!-- Customer List -->
            <div class="flex-1 overflow-y-auto no-scrollbar pb-24 px-4 pt-2" id="customer-list"></div>

            <!-- Add Customer FAB -->
            <button onclick="openModal('add-customer-modal')" 
                class="absolute bottom-6 right-5 bg-gradient-to-r from-brand to-brand_dark text-white h-14 rounded-full px-6 flex items-center gap-2 shadow-[0_8px_20px_-5px_rgba(30,58,138,0.5)] active-scale z-20">
                <i class="fa-solid fa-user-plus text-lg"></i>
                <span class="font-bold tracking-wide" data-i18n="addCustomerBtn">Grahak Jodein</span>
            </button>
        </div>


        <!-- ================= CUSTOMER DETAIL SCREEN ================= -->
        <div id="customer-screen" class="absolute inset-0 flex flex-col w-full h-full bg-gray-50 z-20 translate-x-full screen-transition hidden">
            
            <!-- Header -->
            <header class="bg-gradient-to-r from-brand_dark to-brand text-white pt-4 pb-3 px-3 shadow-md flex justify-between items-center z-20">
                <div class="flex items-center gap-2 flex-1 overflow-hidden">
                    <button onclick="goBackToHome()" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/10 active-scale shrink-0 text-xl">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <div class="flex flex-col flex-1 truncate">
                        <h2 class="text-lg font-bold truncate tracking-tight" id="detail-customer-name">Grahak</h2>
                        <div class="flex items-center gap-2 text-[11px] text-blue-200 font-medium">
                            <span id="detail-customer-phone"><i class="fa-solid fa-phone text-[9px]"></i> N/A</span>
                            <span class="opacity-50">|</span>
                            <span id="detail-customer-address" class="truncate max-w-[120px]"><i class="fa-solid fa-location-dot text-[9px]"></i> N/A</span>
                        </div>
                    </div>
                </div>
                
                <div class="flex gap-1 shrink-0 pr-1">
                    <button onclick="openModal('share-modal')" class="w-9 h-9 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 active-scale text-sm">
                        <i class="fa-solid fa-share-nodes"></i>
                    </button>
                </div>
            </header>

            <!-- Net Balance Banner -->
            <div class="bg-white shadow-sm border-b border-gray-100 px-5 py-3 flex justify-between items-center z-10">
                <div class="flex flex-col">
                    <span class="font-bold text-gray-800" data-i18n="netBalance">Kul Hisab</span>
                    <span class="text-[10px] text-gray-400 font-medium" data-i18n="editTip">Double-click to edit</span>
                </div>
                <div class="text-right">
                    <span id="detail-balance-amount" class="text-2xl font-extrabold tracking-tight">₹0</span>
                    <p id="detail-balance-status" class="text-[11px] font-bold mt-0.5 uppercase tracking-wide">Barabar</p>
                </div>
            </div>
            
            <!-- Transaction List (Bahi Khata) -->
            <div class="flex-1 overflow-y-auto no-scrollbar p-4 bg-[#f0f2f5] flex flex-col gap-3 pb-24" id="transaction-list"></div>

            <!-- Action Buttons Footer -->
            <div class="absolute bottom-0 left-0 w-full bg-white p-3 shadow-[0_-10px_20px_-10px_rgba(0,0,0,0.05)] flex gap-3 z-20 rounded-t-[1.5rem]">
                <button onclick="openTransactionModal('diya')" class="flex-1 bg-red-50 border border-red-200 text-diya py-3.5 rounded-2xl font-bold flex justify-center items-center gap-2 active-scale">
                    <i class="fa-solid fa-minus bg-red-100 p-1.5 rounded-full text-xs"></i>
                    <span data-i18n="gaveBtn">Aapne Diye</span>
                </button>
                <button onclick="openTransactionModal('mila')" class="flex-1 bg-emerald-50 border border-emerald-200 text-mila py-3.5 rounded-2xl font-bold flex justify-center items-center gap-2 active-scale">
                    <i class="fa-solid fa-plus bg-emerald-100 p-1.5 rounded-full text-xs"></i>
                    <span data-i18n="gotBtn">Aapko Mile</span>
                </button>
            </div>
        </div>


        <!-- ================= MODALS ================= -->
        
        <!-- Profile Modal -->
        <div id="profile-modal" class="absolute inset-0 bg-black/70 z-50 modal-overlay hidden flex items-end sm:items-center justify-center opacity-0 transition-opacity">
            <div class="bg-white w-full sm:w-11/12 rounded-t-[2rem] sm:rounded-3xl p-6 transform translate-y-full sm:translate-y-0 transition-transform duration-300 relative shadow-2xl" id="profile-content">
                <button onclick="closeModal('profile-modal')" class="absolute top-5 right-5 text-gray-400 hover:text-gray-800 bg-gray-100 w-8 h-8 rounded-full flex items-center justify-center active-scale">
                    <i class="fa-solid fa-times"></i>
                </button>
                <h3 class="text-xl font-extrabold text-gray-800 mb-6 text-center" data-i18n="myProfile">My Profile</h3>
                
                <div class="flex flex-col items-center gap-4">
                    <div class="relative group cursor-pointer active-scale" onclick="document.getElementById('profile-pic-input').click()">
                        <div class="w-24 h-24 rounded-full bg-blue-50 border-4 border-white shadow-xl overflow-hidden flex items-center justify-center text-blue-300 text-4xl" id="profile-img-preview">
                            <i class="fa-solid fa-camera"></i>
                        </div>
                        <div class="absolute bottom-0 right-0 bg-brand text-white w-8 h-8 rounded-full flex items-center justify-center shadow-lg border-2 border-white">
                            <i class="fa-solid fa-pencil text-xs"></i>
                        </div>
                        <input type="file" id="profile-pic-input" accept="image/*" class="hidden" onchange="handleProfilePic(event)">
                    </div>
                    
                    <div class="w-full mt-4">
                        <label class="block text-xs font-bold text-gray-500 mb-1.5 uppercase tracking-wide" data-i18n="bizNameLabel">Business Name</label>
                        <input type="text" id="profile-name" class="w-full bg-gray-50 border border-gray-200 rounded-xl focus:border-brand focus:bg-white py-3 px-4 outline-none font-semibold text-gray-800 transition-all text-center">
                    </div>
                    
                    <div class="w-full">
                        <label class="block text-xs font-bold text-gray-500 mb-1.5 uppercase tracking-wide" data-i18n="bizAddressLabel">Address</label>
                        <input type="text" id="profile-address" class="w-full bg-gray-50 border border-gray-200 rounded-xl focus:border-brand focus:bg-white py-3 px-4 outline-none font-semibold text-gray-800 transition-all text-center">
                    </div>
                    
                    <button onclick="saveProfile()" class="w-full bg-brand text-white py-4 rounded-xl font-bold mt-2 active-scale shadow-lg shadow-brand/30 text-lg">
                        <span data-i18n="saveBtn">Save Karein</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Add Customer Modal -->
        <div id="add-customer-modal" class="absolute inset-0 bg-black/70 z-50 modal-overlay hidden flex items-end sm:items-center justify-center opacity-0 transition-opacity">
            <div class="bg-white w-full sm:w-11/12 rounded-t-[2rem] sm:rounded-3xl p-6 transform translate-y-full sm:translate-y-0 transition-transform duration-300 shadow-2xl" id="add-customer-content">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-extrabold text-gray-800" data-i18n="addNewCustTitle">Naya Grahak Jodein</h3>
                    <button onclick="closeModal('add-customer-modal')" class="text-gray-400 bg-gray-100 w-8 h-8 rounded-full flex items-center justify-center active-scale">
                        <i class="fa-solid fa-times"></i>
                    </button>
                </div>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1.5 uppercase tracking-wide"><span data-i18n="custNameLabel">Grahak ka Naam</span> <span class="text-red-500">*</span></label>
                        <input type="text" id="new-cust-name" class="w-full bg-gray-50 border border-gray-200 rounded-xl focus:border-brand py-3 px-4 outline-none font-semibold transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1.5 uppercase tracking-wide" data-i18n="custPhoneLabel">Mobile Number</label>
                        <input type="tel" id="new-cust-phone" class="w-full bg-gray-50 border border-gray-200 rounded-xl focus:border-brand py-3 px-4 outline-none font-semibold transition-all" placeholder="10 digits">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1.5 uppercase tracking-wide" data-i18n="custAddressLabel">Pata (Address)</label>
                        <input type="text" id="new-cust-address" class="w-full bg-gray-50 border border-gray-200 rounded-xl focus:border-brand py-3 px-4 outline-none font-semibold transition-all">
                    </div>
                    <button onclick="saveCustomer()" class="w-full bg-brand text-white py-4 rounded-xl font-bold mt-2 active-scale shadow-lg shadow-brand/30 text-lg">
                        <span data-i18n="saveBtn">Save Karein</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Add/Edit Transaction Modal -->
        <div id="add-transaction-modal" class="absolute inset-0 bg-black/70 z-50 modal-overlay hidden flex items-end sm:items-center justify-center opacity-0 transition-opacity">
            <div class="bg-white w-full sm:w-11/12 rounded-t-[2rem] sm:rounded-3xl p-6 transform translate-y-full sm:translate-y-0 transition-transform duration-300 relative shadow-2xl" id="add-tx-content">
                
                <button id="delete-tx-btn" onclick="deleteTransaction()" class="absolute top-6 left-6 text-red-500 bg-red-50 w-9 h-9 rounded-full flex items-center justify-center active-scale transition hidden">
                    <i class="fa-solid fa-trash"></i>
                </button>

                <div class="flex justify-between items-center mb-6 pl-12">
                    <h3 class="text-2xl font-extrabold tracking-tight" id="tx-modal-title">Darj Karein</h3>
                    <button onclick="closeModal('add-transaction-modal')" class="text-gray-400 bg-gray-100 w-8 h-8 rounded-full flex items-center justify-center active-scale">
                        <i class="fa-solid fa-times"></i>
                    </button>
                </div>
                
                <input type="hidden" id="tx-type" value="">
                <input type="hidden" id="tx-id" value="">
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1.5 uppercase tracking-wide"><span data-i18n="amountLabel">Rakam (Amount) ₹</span> <span class="text-red-500">*</span></label>
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-2xl font-bold text-gray-400">₹</span>
                            <input type="number" id="tx-amount" class="w-full bg-gray-50 border border-gray-200 rounded-xl focus:border-brand py-3 pl-10 pr-4 outline-none text-3xl font-extrabold text-gray-800 transition-all">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1.5 uppercase tracking-wide" data-i18n="detailsLabel">Vivaran (Details)</label>
                        <input type="text" id="tx-note" class="w-full bg-gray-50 border border-gray-200 rounded-xl focus:border-brand py-3 px-4 outline-none font-semibold transition-all" placeholder="Optional">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1.5 uppercase tracking-wide" data-i18n="dateLabel">Tareekh (Date)</label>
                        <input type="date" id="tx-date" class="w-full bg-gray-50 border border-gray-200 rounded-xl focus:border-brand py-3 px-4 outline-none font-semibold text-gray-700 transition-all">
                    </div>
                    
                    <button id="save-tx-btn" onclick="saveTransaction()" class="w-full py-4 rounded-xl font-bold mt-2 active-scale shadow-lg text-white text-lg">
                        <span data-i18n="saveBtn">Save Karein</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Statement Share & Print Modal -->
        <div id="share-modal" class="absolute inset-0 bg-black/70 z-50 modal-overlay hidden flex items-end sm:items-center justify-center opacity-0 transition-opacity">
            <div class="bg-white w-full sm:w-11/12 rounded-t-[2rem] sm:rounded-3xl p-6 transform translate-y-full sm:translate-y-0 transition-transform duration-300 shadow-2xl" id="share-content">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-extrabold text-gray-800" data-i18n="shareTitle">Share / Print Statement</h3>
                    <button onclick="closeModal('share-modal')" class="text-gray-400 bg-gray-100 w-8 h-8 rounded-full flex items-center justify-center active-scale">
                        <i class="fa-solid fa-times"></i>
                    </button>
                </div>
                <p class="text-sm text-gray-500 mb-5 font-medium" data-i18n="shareDesc">Grahak ko unka hisab bhejein ya Print nikalein.</p>
                
                <div class="space-y-3">
                    
                    <!-- NEW: Print Statement Option (Full Colored Table) -->
                    <button onclick="printStatement()" class="w-full bg-indigo-50 border-2 border-indigo-200 text-indigo-700 py-4 rounded-2xl font-bold flex items-center justify-center gap-3 active-scale mb-4">
                        <i class="fa-solid fa-print text-2xl"></i>
                        <div class="text-left">
                            <span class="block text-sm" data-i18n="printStmt">Print Statement</span>
                            <span class="text-[10px] font-semibold opacity-70">Save as PDF / Direct Print</span>
                        </div>
                    </button>

                    <!-- Text Statement Options -->
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="shareTextStatement('full', 'whatsapp')" class="w-full bg-[#25D366]/10 border-2 border-[#25D366] text-[#128C7E] py-3.5 rounded-xl font-bold flex flex-col items-center justify-center gap-1 active-scale">
                            <i class="fa-brands fa-whatsapp text-2xl"></i>
                            <span class="text-[11px] uppercase tracking-wide">WhatsApp</span>
                        </button>
                        <button onclick="shareTextStatement('full', 'copy')" class="w-full bg-gray-50 border-2 border-gray-200 text-gray-600 py-3.5 rounded-xl font-bold flex flex-col items-center justify-center gap-1 active-scale">
                            <i class="fa-regular fa-copy text-2xl"></i>
                            <span class="text-[11px] uppercase tracking-wide">Copy Text</span>
                        </button>
                    </div>
                    
                    <button onclick="deleteCustomerConfirm()" class="w-full text-red-500 py-3 mt-3 font-bold hover:bg-red-50 rounded-xl transition uppercase text-xs tracking-wider border border-transparent">
                        <i class="fa-solid fa-trash mr-1"></i> Delete Customer
                    </button>
                </div>
            </div>
        </div>

        <!-- Settings Modal -->
        <div id="settings-modal" class="absolute inset-0 bg-black/70 z-50 modal-overlay hidden flex items-end sm:items-center justify-center opacity-0 transition-opacity">
            <div class="bg-white w-full sm:w-11/12 rounded-t-[2rem] sm:rounded-3xl p-6 transform translate-y-full sm:translate-y-0 transition-transform duration-300 shadow-2xl" id="settings-content">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-extrabold text-gray-800" data-i18n="settingsTitle">Settings</h3>
                    <button onclick="closeModal('settings-modal')" class="text-gray-400 bg-gray-100 w-8 h-8 rounded-full flex items-center justify-center active-scale">
                        <i class="fa-solid fa-times"></i>
                    </button>
                </div>
                
                <div class="space-y-4">
                    <div class="flex justify-between items-center p-4 bg-gray-50 rounded-2xl border border-gray-200">
                        <div class="flex items-center gap-3 text-gray-700 font-bold">
                            <i class="fa-solid fa-language text-2xl text-brand"></i>
                            <span data-i18n="appLang">Language</span>
                        </div>
                        <div class="flex bg-gray-200 rounded-xl p-1 text-sm font-bold shadow-inner">
                            <button onclick="setLanguage('en')" id="btn-lang-en" class="px-5 py-2 rounded-lg transition text-gray-500">EN</button>
                            <button onclick="setLanguage('hi')" id="btn-lang-hi" class="px-5 py-2 rounded-lg bg-white shadow-md text-brand">HI</button>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3 mt-4">
                        <button onclick="backupData()" class="w-full bg-blue-50 border-2 border-blue-200 text-blue-700 py-4 rounded-2xl font-bold flex flex-col items-center gap-2 active-scale">
                            <i class="fa-solid fa-cloud-arrow-down text-2xl"></i>
                            <span class="text-xs uppercase tracking-wide" data-i18n="backupBtn">Backup</span>
                        </button>
                        <button onclick="document.getElementById('restore-input').click()" class="w-full bg-emerald-50 border-2 border-emerald-200 text-emerald-700 py-4 rounded-2xl font-bold flex flex-col items-center gap-2 active-scale">
                            <i class="fa-solid fa-clock-rotate-left text-2xl"></i>
                            <span class="text-xs uppercase tracking-wide" data-i18n="restoreBtn">Restore</span>
                        </button>
                        <input type="file" id="restore-input" accept=".json" class="hidden" onchange="restoreData(event)">
                    </div>
                    
                    <button onclick="clearAllData()" class="w-full bg-red-50 text-red-600 py-4 mt-2 font-bold rounded-2xl active-scale uppercase text-xs tracking-wider border-2 border-red-200" data-i18n="clearDataBtn">
                        Delete All Data
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- Hiddent Print Area -->
    <div id="print-area" class="hidden"></div>

    <!-- Application Logic -->
    <script>
        // --- TRANSLATIONS ---
        const i18n = {
            hi: {
                appTitle: "डिजिटल खाता", myProfile: "मेरी प्रोफाइल", youWillGet: "मिलेगा (उधार)", youWillGive: "देना है (एडवांस)",
                searchPlaceholder: "ग्राहक खोजें...", addCustomerBtn: "ग्राहक जोड़ें", netBalance: "कुल हिसाब", gaveBtn: "आपने दिए",
                gotBtn: "आपको मिले", bizNameLabel: "दुकान / आपका नाम", bizAddressLabel: "पता (Address)", saveBtn: "सेव करें",
                addNewCustTitle: "नया ग्राहक", custNameLabel: "ग्राहक का नाम", custPhoneLabel: "मोबाइल नंबर",

        const LOCAL_STORAGE_KEY = 'digital_khata_apk_data';
        let state = { profile: { name: '', avatar: '', address: '' }, lang: 'hi', customers: [], currentCustomerId: null };
        const t = (key) => i18n[state.lang][key] || key;

        const applyTranslations = () => {
            document.querySelectorAll('[data-i18n]').forEach(el => { const k = el.getAttribute('data-i18n'); if (i18n[state.lang][k]) el.innerText = i18n[state.lang][k]; });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { const k = el.getAttribute('data-i18n-placeholder'); if (i18n[state.lang][k]) el.placeholder = i18n[state.lang][k]; });
            const bEn = document.getElementById('btn-lang-en'), bHi = document.getElementById('btn-lang-hi');
            if(state.lang === 'en') { bEn.className = "px-5 py-2 rounded-lg bg-white shadow-md text-brand font-extrabold"; bHi.className = "px-5 py-2 rounded-lg transition text-gray-500 font-bold hover:bg-gray-300"; }
            else { bHi.className = "px-5 py-2 rounded-lg bg-white shadow-md text-brand font-extrabold"; bEn.className = "px-5 py-2 rounded-lg transition text-gray-500 font-bold hover:bg-gray-300"; }
            if(state.currentCustomerId) renderCustomerScreen(); renderHomeList(); updateProfileUI();
        };

        const setLanguage = (lang) => { state.lang = lang; saveDataLocally(); applyTranslations(); };
        const showToast = (msg, isErr=false) => { const t = document.getElementById('toast'); t.innerText=msg; t.className=`fixed top-14 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-xl shadow-[0_10px_25px_-5px_rgba(0,0,0,0.3)] transition-all duration-300 z-[9999] font-bold text-sm text-center min-w-[220px] ${isErr?'bg-red-600 text-white':'bg-gray-900 text-white'}`; t.classList.remove('opacity-0', '-translate-y-4'); setTimeout(()=>{t.classList.add('opacity-0', '-translate-y-4');}, 3000); };
        const saveDataLocally = () => localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(state));
        
        const loadDataLocally = () => {
            const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
            if (saved) { try { const p = JSON.parse(saved); state.customers = p.customers||[]; state.profile = p.profile||{name:'',avatar:'',address:''}; state.lang = p.lang||'hi'; }catch(e){} }
            else { state.customers = [{id:'1',name:'Ramesh Kirana',phone:'9876543210',address:'Main Bazar',transactions:[{id:'t1',type:'diya',amount:500,note:'Samaan',date:new Date().toISOString()}]}]; saveDataLocally(); }
        };

        const handleProfilePic = (e) => { const f = e.target.files[0]; if(f){ if(f.size>2*1024*1024) return showToast("Image too large (Max 2MB)",true); const r = new FileReader(); r.onload = (ev) => { const p = document.getElementById('profile-img-preview'); p.innerHTML=`<img src="${ev.target.result}" class="w-full h-full avatar-img">`; p.dataset.base64=ev.target.result; }; r.readAsDataURL(f); } };
        const saveProfile = () => { state.profile = { name: document.getElementById('profile-name').value.trim(), address: document.getElementById('profile-address').value.trim(), avatar: document.getElementById('profile-img-preview').dataset.base64 || state.profile.avatar }; saveDataLocally(); updateProfileUI(); closeModal('profile-modal'); showToast(t('saveBtn')); };
        const updateProfileUI = () => { 
            document.getElementById('header-biz-name').innerText = state.profile.name || t('appTitle');
            const ab = document.getElementById('header-avatar-btn');
            ab.innerHTML = state.profile.avatar ? `<img src="${state.profile.avatar}" class="w-full h-full avatar-img">` : `<i class="fa-solid fa-user text-xl"></i>`;
            document.getElementById('profile-name').value = state.profile.name||''; document.getElementById('profile-address').value = state.profile.address||'';
            if(state.profile.avatar) { const p = document.getElementById('profile-img-preview'); p.innerHTML=`<img src="${state.profile.avatar}" class="w-full h-full avatar-img">`; p.dataset.base64=state.profile.avatar; }
        };

        const formatMoney = (amt) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(amt);
        const formatDate = (iso, hideRel=false) => { const d = new Date(iso), tdy = new Date(), yst = new Date(tdy); yst.setDate(yst.getDate()-1); if(!hideRel) { if (d.toDateString()===tdy.toDateString()) return t('today'); if (d.toDateString()===yst.toDateString()) return t('yesterday'); } return d.toLocaleDateString('en-IN', {day:'2-digit',month:'short',year:'numeric'}); };
        const getCustomerBalance = (cust) => { let d=0,m=0; cust.transactions.forEach(tx=>{ if(tx.type==='diya')d+=Number(tx.amount); if(tx.type==='mila')m+=Number(tx.amount); }); return d-m; };
        
        const updateDashboardTotals = () => { let u=0,a=0; state.customers.forEach(c=>{ const b=getCustomerBalance(c); if(b>0)u+=b; else if(b<0)a+=Math.abs(b); }); document.getElementById('total-udhaar').innerText = formatMoney(u); document.getElementById('total-advance').innerText = formatMoney(a); };
        
        const renderHomeList = (q='') => {
            const list = document.getElementById('customer-list'); list.innerHTML='';
            const f = state.customers.filter(c=>c.name.toLowerCase().includes(q.toLowerCase()));
            if(!f.length) return list.innerHTML=`<div class="flex flex-col items-center justify-center text-gray-400 mt-20"><i class="fa-solid fa-users text-4xl mb-3 opacity-30"></i><p class="font-semibold">${t('noCustFound')}</p></div>`;
            f.sort((a,b)=> (b.transactions.length?new Date(b.transactions[b.transactions.length-1].date).getTime():0) - (a.transactions.length?new Date(a.transactions[a.transactions.length-1].date).getTime():0));
            f.forEach(c => {
                const bal = getCustomerBalance(c); const isDue = bal>0, isAdv = bal<0;
                const el = document.createElement('div'); el.className="flex justify-between p-4 bg-white mb-2.5 rounded-[1rem] shadow-[0_2px_10px_-4px_rgba(0,0,0,0.1)] active-scale cursor-pointer"; el.onclick=()=>openCustomer(c.id);
                el.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <div class="w-12 h-12 shrink-0 rounded-full bg-blue-50 text-brand flex items-center justify-center font-extrabold text-xl border border-blue-100">${c.name[0].toUpperCase()}</div>
                        <div class="truncate"><h4 class="font-extrabold text-gray-800 text-base truncate">${c.name}</h4><p class="text-[11px] text-gray-500 font-medium truncate mt-0.5">${c.address?`<i class="fa-solid fa-location-dot text-[9px] mr-1"></i>${c.address}`:(c.phone?`<i class="fa-solid fa-phone text-[9px] mr-1"></i>${c.phone}`:'')}</p></div>
                    </div>
                    <div class="text-right flex flex-col items-end justify-center shrink-0 pl-2">
                        <div class="${isDue?'text-diya font-extrabold text-lg':(isAdv?'text-mila font-extrabold text-lg':'text-gray-400 font-bold text-base')}">${bal===0?t('settled'):formatMoney(Math.abs(bal))}</div>
                        ${bal!==0?`<span class="text-[10px] text-gray-400 font-semibold uppercase tracking-wider">${isDue?t('udhaarText'):t('advanceText')}</span>`:''}
                    </div>`;
                list.appendChild(el);
            });
            updateDashboardTotals();
        };

        const renderCustomerScreen = () => {
            const cust = state.customers.find(c=>c.id===state.currentCustomerId); if(!cust) return;
            document.getElementById('detail-customer-name').innerText=cust.name;
            document.getElementById('detail-customer-phone').innerHTML=cust.phone?`<i class="fa-solid fa-phone text-[9px]"></i> ${cust.phone}`:'N/A';
            document.getElementById('detail-customer-address').innerHTML=cust.address?`<i class="fa-solid fa-location-dot text-[9px]"></i> ${cust.address}`:'N/A';
            const bal = getCustomerBalance(cust);
            const amtE = document.getElementById('detail-balance-amount'), statE = document.getElementById('detail-balance-status');
            amtE.innerText = bal===0?'₹0':formatMoney(Math.abs(bal));
            amtE.className = `text-2xl font-extrabold tracking-tight ${bal===0?'text-gray-800':(bal>0?'text-diya':'text-mila')}`;
            statE.innerText = bal===0?t('settled'):(bal>0?t('willGetDetail'):t('willGiveDetail'));
            statE.className = `text-[11px] font-bold mt-0.5 uppercase tracking-wide ${bal===0?'text-gray-400':(bal>0?'text-diya':'text-mila')}`;

            const list = document.getElementById('transaction-list'); list.innerHTML='';
            if(!cust.transactions.length) return list.innerHTML=`<div class="flex flex-col items-center justify-center text-gray-400 mt-20"><i class="fa-solid fa-receipt text-5xl mb-4 opacity-20"></i><p class="font-bold">${t('noTxText')}</p></div>`;
            let ld='';
            [...cust.transactions].sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(tx => {
                const ds = formatDate(tx.date); if(ds!==ld){ list.innerHTML+=`<div class="text-center my-3"><span class="bg-white border border-gray-200 text-gray-500 text-[10px] font-bold px-4 py-1.5 rounded-full uppercase shadow-sm tracking-wider">${ds}</span></div>`; ld=ds; }
                const isD = tx.type==='diya';
                
                const txEl = document.createElement('div');
                txEl.className = `flex w-full mb-3 ${!isD ? 'justify-end' : ''}`;
                txEl.innerHTML = `
                    <div class="relative bg-white border-${isD?'l':'r'}-4 border-${isD?'diya':'mila'} rounded-[1rem] ${isD?'rounded-bl-sm':'rounded-br-sm'} shadow-[0_2px_8px_-4px_rgba(0,0,0,0.1)] p-3.5 w-[78%] active-scale" 
                         ondblclick="editTransaction('${tx.id}')">
                        <span class="text-xl font-extrabold text-gray-800 block leading-none">${formatMoney(tx.amount)}</span>
                        ${tx.note?`<p class="text-[13px] text-gray-500 font-medium mt-1.5 leading-snug">${tx.note}</p>`:''}
                        <p class="text-[9px] text-gray-400 font-bold mt-2 text-right uppercase tracking-wider">${new Date(tx.date).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</p>
                    </div>`;
                
                let pressTimer;
                const txCard = txEl.querySelector('.active-scale');
                txCard.addEventListener('touchstart', () => { pressTimer = setTimeout(() => editTransaction(tx.id), 600); });
                txCard.addEventListener('touchend', () => clearTimeout(pressTimer));
                txCard.addEventListener('touchmove', () => clearTimeout(pressTimer));
                list.appendChild(txEl);
            });
            setTimeout(()=>list.scrollTop=list.scrollHeight,50);
        };

        const openCustomer=(id)=>{ state.currentCustomerId=id; renderCustomerScreen(); const h=document.getElementById('home-screen'),c=document.getElementById('customer-screen'); c.classList.remove('hidden'); setTimeout(()=>{h.classList.add('-translate-x-full');c.classList.remove('translate-x-full');},10); };
        const goBackToHome=()=>{ const h=document.getElementById('home-screen'),c=document.getElementById('customer-screen'); h.classList.remove('-translate-x-full');c.classList.add('translate-x-full'); renderHomeList(); setTimeout(()=>{c.classList.add('hidden');state.currentCustomerId=null;},300); };
        const filterCustomers=()=>renderHomeList(document.getElementById('search-input').value);
        const openModal=(id)=>{ const m=document.getElementById(id),c=m.querySelector('div[id$="-content"]'); m.classList.remove('hidden'); if(id==='add-transaction-modal' && !document.getElementById('tx-id').value){document.getElementById('tx-date').valueAsDate=new Date();setTimeout(()=>document.getElementById('tx-amount').focus(),100);}else if(id==='add-customer-modal'){setTimeout(()=>document.getElementById('new-cust-name').focus(),100);} setTimeout(()=>{m.classList.remove('opacity-0');if(c)c.classList.remove('translate-y-full');},10); };
        const closeModal=(id)=>{ const m=document.getElementById(id),c=m.querySelector('div[id$="-content"]'); m.classList.add('opacity-0');if(c)c.classList.add('translate-y-full'); setTimeout(()=>{m.classList.add('hidden');m.querySelectorAll('input').forEach(i=>{if(i.type!=='hidden'&&i.type!=='file')i.value='';}); document.getElementById('tx-id').value=''; document.getElementById('delete-tx-btn').classList.add('hidden'); },300); };

        const saveCustomer=()=>{ const n=document.getElementById('new-cust-name').value.trim(),p=document.getElementById('new-cust-phone').value.trim(),a=document.getElementById('new-cust-address').value.trim(); if(!n)return showToast(state.lang==='en'?"Enter Name":"Naam likhein",true); state.customers.push({id:Date.now().toString(),name:n,phone:p,address:a,transactions:[]}); saveDataLocally();closeModal('add-customer-modal');renderHomeList();showToast(t('saveBtn')); };
        
        const openTransactionModal=(t_type)=>{ document.getElementById('tx-id').value=''; document.getElementById('delete-tx-btn').classList.add('hidden'); const title=document.getElementById('tx-modal-title'),btn=document.getElementById('save-tx-btn'),ti=document.getElementById('tx-type'); title.innerText=t_type==='diya'?t('txTitleGave'):t('txTitleGot'); title.className=`text-2xl font-extrabold tracking-tight ${t_type==='diya'?'text-diya':'text-mila'}`; btn.innerHTML=`<span data-i18n="saveBtn">${t('saveBtn')}</span>`; btn.className=`w-full py-4 rounded-xl font-bold mt-2 active-scale shadow-lg text-white text-lg ${t_type==='diya'?'bg-diya shadow-diya/30':'bg-mila shadow-mila/30'}`; ti.value=t_type; openModal('add-transaction-modal'); };
        const editTransaction = (txId) => {
            const cust = state.customers.find(c => c.id === state.currentCustomerId);
            const tx = cust.transactions.find(t => t.id === txId); if(!tx) return;
            document.getElementById('tx-id').value = tx.id; document.getElementById('tx-type').value = tx.type; document.getElementById('tx-amount').value = tx.amount; document.getElementById('tx-note').value = tx.note || '';
            document.getElementById('tx-date').value = new Date(tx.date).toISOString().split('T')[0];
            document.getElementById('delete-tx-btn').classList.remove('hidden');
            const title = document.getElementById('tx-modal-title'), btn = document.getElementById('save-tx-btn');
            title.innerText = t('editTxTitle'); title.className = `text-2xl font-extrabold tracking-tight ${tx.type==='diya'?'text-diya':'text-mila'}`; btn.innerText = t('updateBtn'); btn.className = `w-full py-4 rounded-xl font-bold mt-2 active-scale shadow-lg text-white text-lg ${tx.type==='diya'?'bg-diya shadow-diya/30':'bg-mila shadow-mila/30'}`;
            openModal('add-transaction-modal');
        };
        const saveTransaction=()=>{ const a=Number(document.getElementById('tx-amount').value),n=document.getElementById('tx-note').value.trim(),dVal=document.getElementById('tx-date').value; if(!a||a<=0)return showToast("Invalid amount",true); const cust=state.customers.find(c=>c.id===state.currentCustomerId); const editId = document.getElementById('tx-id').value, tType = document.getElementById('tx-type').value;
            if(editId) { const i = cust.transactions.findIndex(t => t.id === editId); if(i > -1) { let txDate = new Date(cust.transactions[i].date); if(dVal){ const s=new Date(dVal); txDate.setFullYear(s.getFullYear(), s.getMonth(), s.getDate()); } cust.transactions[i] = { ...cust.transactions[i], amount: a, note: n, date: txDate.toISOString() }; showToast("Updated!"); } } 
            else { let txD=new Date(); if(dVal){const s=new Date(dVal);txD.setFullYear(s.getFullYear(),s.getMonth(),s.getDate());} cust.transactions.push({id:'tx_'+Date.now(), type:tType, amount:a, note:n, date:txD.toISOString()}); showToast(t('saveBtn')); }
            saveDataLocally(); closeModal('add-transaction-modal'); renderCustomerScreen(); updateDashboardTotals(); 
        };
        const deleteTransaction = () => { const editId = document.getElementById('tx-id').value; if(!editId) return; if(confirm(state.lang==='en'?"Delete entry?":"Delete karein?")) { const cust = state.customers.find(c => c.id === state.currentCustomerId); cust.transactions = cust.transactions.filter(t => t.id !== editId); saveDataLocally(); closeModal('add-transaction-modal'); renderCustomerScreen(); updateDashboardTotals(); showToast("Deleted"); } };
        const deleteCustomerConfirm=()=>{ if(confirm(state.lang==='en'?"Delete customer completely?":"Grahak ka poora hisab delete karein?")){ state.customers=state.customers.filter(c=>c.id!==state.currentCustomerId); saveDataLocally(); closeModal('share-modal'); goBackToHome(); showToast("Deleted"); } };

        const backupData=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:"application/json"})); a.download=`Khata_Backup_${new Date().toISOString().split('T')[0]}.json`; a.click();URL.revokeObjectURL(a.href);closeModal('settings-modal');showToast("Backup Downloaded!"); };
        const restoreData=(e)=>{ const f=e.target.files[0];if(!f)return; const r=new FileReader(); r.onload=(ev)=>{try{const p=JSON.parse(ev.target.result);if(p.customers){state=p;saveDataLocally();applyTranslations();closeModal('settings-modal');showToast("Restored!");}else throw new Error();}catch(err){showToast("Invalid File",true);} e.target.value='';}; r.readAsText(f); };
        const clearAllData=()=>{ if(confirm(state.lang==='en'?"Delete EVERYTHING permanently?":"Kya aap saara data delete karna chahte hain?")){ state.customers=[];state.profile={name:'',avatar:'',address:''}; saveDataLocally();renderHomeList();updateProfileUI();closeModal('settings-modal');showToast("Data Cleared"); } };

        // --- SHARE LOGIC (TEXT) ---
        const buildStatementText = (type) => {
            const cust = state.customers.find(c => c.id === state.currentCustomerId);
            const bal = getCustomerBalance(cust);
            const bizName = state.profile.name || "Digital Khata";
            const dateStr = new Date().toLocaleDateString('en-IN', {day:'2-digit',month:'short',year:'numeric'});
            
            let text = `🧾 *${bizName}*\n`;
            if (state.profile.address) text += `📍 ${state.profile.address}\n`;
            text += `------------------------\n`;
            text += `👤 *Grahak:* ${cust.name}\n`;
            text += `📅 *Date:* ${dateStr}\n\n`;

            let balText = bal === 0 ? "Hisaab Barabar" : (bal > 0 ? `Baki (Due): ₹${bal}` : `Advance Jama: ₹${Math.abs(bal)}`);
            text += `*💰 KUL HISAAB: ${balText}*\n`;
            text += `------------------------\n`;

            if (type === 'full' && cust.transactions.length > 0) {
                text += `\n*🧾 LEN-DEN DETAILS:*\n\n`;
                const sortedTx = [...cust.transactions].sort((a, b) => new Date(a.date) - new Date(b.date));
                sortedTx.forEach((tx, i) => {
                    const isDiya = tx.type === 'diya';
                    const txDate = formatDate(tx.date, true);
                    const mark = isDiya ? "🔴 Diya: " : "🟢 Mila: ";
                    text += `${i+1}. ${txDate} | ${mark} ₹${tx.amount}\n`;
                    if(tx.note) text += `   📝 ${tx.note}\n`;
                    text += `\n`;
                });
                text += `------------------------\n`;
            }

            text += `\n🙏 *Thank You!*\n_(Sent via Digital Khata App)_`;
            return text;
        };

        const shareTextStatement = (type, action) => {
            const text = buildStatementText(type);
            if (action === 'whatsapp') {
                window.open(`https://wa.me/?text=${encodeURIComponent(text)}`);
            } else if (action === 'copy') {
                const el = document.createElement('textarea');
                el.value = text;
                document.body.appendChild(el);
                el.select();
                try { document.execCommand('copy'); showToast("Statement Copied!"); } catch (err) { showToast("Failed to copy", true); }
                document.body.removeChild(el);
            }
            closeModal('share-modal');
        };

        // --- SHANDAR PRINT / PDF STATEMENT LOGIC ---
        const printStatement = () => {
            const cust = state.customers.find(c => c.id === state.currentCustomerId);
            if(!cust) return;

            const bal = getCustomerBalance(cust);
            const bizName = state.profile.name || "Digital Khata";
            const bizAddr = state.profile.address || "";
            const logoSrc = state.profile.avatar || "";
            const currDate = new Date();
            const dateStr = currDate.toLocaleDateString('en-IN', {day:'2-digit',month:'short',year:'numeric'});

            let txHtml = '';
            const sortedTx = [...cust.transactions].sort((a, b) => new Date(a.date) - new Date(b.date));
            
            sortedTx.forEach((tx, i) => {
                const isDiya = tx.type === 'diya';
                txHtml += `
                    <tr>
                        <td style="padding: 12px; border-bottom: 1px solid #e5e7eb; font-size: 14px; text-align: center;">${i+1}</td>
                        <td style="padding: 12px; border-bottom: 1px solid #e5e7eb; font-size: 14px;">${formatDate(tx.date, true)}</td>
                        <td style="padding: 12px; border-bottom: 1px solid #e5e7eb; font-size: 14px;">${tx.note || '-'}</td>
                        <td style="padding: 12px; border-bottom: 1px solid #e5e7eb; font-size: 14px; text-align: right; color: #10b981; font-weight: bold;">${!isDiya ? formatMoney(tx.amount) : '-'}</td>

                            ${cust.address ? `<p style="margin: 0; font-size: 14px; color: #334155;"><strong>Address:</strong> ${cust.address}</p>` : ''}
                        </div>
                        <div style="text-align: right; border-left: 2px dashed #cbd5e1; padding-left: 20px; display: flex; flex-direction: column; justify-content: center;">

                                <th style="background-color: #1e40af; color: white; padding: 12px; font-size: 14px; text-align: center; border-radius: 8px 0 0 0;">${t('pSno')}</th>
                                <th style="background-color: #1e40af; color: white; padding: 12px; font-size: 14px; text-align: left;">${t('pDate')}</th>

            // Small timeout to allow DOM to update, then call print
            setTimeout(() => {

        window.onload = () => { loadDataLocally(); applyTranslations(); };
